plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

// The Blockbench .bbmodel to GeckoLib converter in src/tools, run with the bbmodel task below. It is not part of the mod
// jar; the unit tests see its classes.
sourceSets {
	tools
	test {
		compileClasspath += sourceSets.tools.output
		runtimeClasspath += sourceSets.tools.output
	}
}

dependencies {
	// Gson at the version Minecraft 26.2 ships. The tools source set has no Minecraft classpath of its own.
	toolsImplementation 'com.google.code.gson:gson:2.14.0'

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib renders NPC models on the client only. The pack ships it client side, so nothing outside
	// town.lampas.haruhi.client may reference com.geckolib (ArchitectureTest enforces this). localRuntime puts it on the
	// dev classpath for runClient and the GameTests without publishing it as a dependency.
	compileOnly "maven.modrinth:geckolib:${project.geckolib_version}"
	localRuntime "maven.modrinth:geckolib:${project.geckolib_version}"
	// The client renderer's unit tests load GeckoLib classes; test configurations are not published either.
	testRuntimeOnly "maven.modrinth:geckolib:${project.geckolib_version}"

	// PostgreSQL storage adapter, nested in the jar.
	implementation "org.postgresql:postgresql:${project.postgresql_version}"
	include "org.postgresql:postgresql:${project.postgresql_version}"
	implementation "com.zaxxer:HikariCP:${project.hikaricp_version}"
	include "com.zaxxer:HikariCP:${project.hikaricp_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation "org.testcontainers:testcontainers-postgresql:${project.testcontainers_version}"
	testImplementation "org.testcontainers:testcontainers-junit-jupiter:${project.testcontainers_version}"
	testImplementation "com.networknt:json-schema-validator:${project.json_schema_validator_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
	// Server GameTests in src/gametest, run with runGameTest.
	configureTests {
		createSourceSet = true
		modId = 'haruhi-gametest'
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

def gameTestReportFile = layout.buildDirectory.file('test-results/gameTest/TEST-haruhi-gametest.xml')

tasks.named('runGameTest') {
	systemProperty 'fabric-api.gametest.report-file', gameTestReportFile.get().asFile.absolutePath
	doFirst {
		gameTestReportFile.get().asFile.parentFile.mkdirs()
	}
}

test {
	useJUnitPlatform()
	// ArchitectureTest reads the compiled main classes.
	dependsOn 'classes'
	systemProperty 'haruhi.mainClasses', sourceSets.main.output.classesDirs.asPath
	// BundleSchemaTest and BuiltinSchemaTest read these from the project directory, so a change to them reruns the tests.
	inputs.files('docs/bundle.schema.json', 'AGENTS.md', 'README.md', fileTree('docs') { include '*.md' },
			fileTree('src/gametest/resources/haruhi/fixtures'))
			.withPropertyName('bundleSchemaFiles')
			.withPathSensitivity(PathSensitivity.RELATIVE)
}

// .\gradlew.bat bbmodel --args='<in.bbmodel> <outputRoot> <namespace> <name>' (see the AGENTS.md section on the tool).
tasks.register('bbmodel', JavaExec) {
	group = 'haruhi'
	description = 'Converts a Blockbench .bbmodel into a GeckoLib model, animations and texture.'
	classpath = sourceSets.tools.runtimeClasspath
	mainClass = 'town.lampas.haruhi.tools.bbmodel.BbmodelCli'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// The bundle schema ships in the jar as haruhi/bundle.schema.json, so a mod that builds on haruhi can check its
	// own schema against the version it depends on.
	from('docs/bundle.schema.json') {
		into 'haruhi'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Published to the JustBecause Maven repository (https://github.com/justbecauseph/maven) by
// .github/workflows/release.yml. Minecraft 26.2 is not obfuscated, so the jar is used as built:
// implementation "town.lampas:haruhi:<version>" from https://raw.githubusercontent.com/justbecauseph/maven/main.
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java

			groupId = project.maven_group.toString()
			artifactId = project.archives_base_name.toString()
			version = project.version.toString()

			pom {
				name = 'Haruhi'
				description = 'Scriptable NPCs for Fabric: data-driven dialogue graphs, a visual-novel dialogue screen, Blockbench (GeckoLib) models and per-character dialogue flags.'
				url = 'https://github.com/justbecauseph/haruhi'

				licenses {
					license {
						name = 'Mozilla Public License 2.0'
						url = 'https://www.mozilla.org/MPL/2.0/'
					}
				}

				scm {
					connection = 'scm:git:https://github.com/justbecauseph/haruhi.git'
					developerConnection = 'scm:git:ssh://git@github.com/justbecauseph/haruhi.git'
					url = 'https://github.com/justbecauseph/haruhi'
				}

				withXml {
					// GeckoLib is compile-only (client side only) and must never reach a consumer's runtime classpath.
					def dependenciesNode = asNode().dependencies[0]
					if (dependenciesNode != null) {
						dependenciesNode.dependency.each { dep ->
							if (dep.artifactId.text() == 'geckolib') {
								throw new GradleException('GeckoLib leaked into the publication POM')
							}
						}
					}
				}
			}
		}
	}

	repositories {
		maven {
			name = 'publicMaven'

			// CI points this at a checkout of justbecauseph/maven. Locally, publishing falls back to build/public-maven.
			url = uri(System.getenv('PUBLIC_MAVEN_REPO_DIR')
					?: layout.buildDirectory.dir('public-maven').get().asFile)
		}
	}
}

// Gradle consumers read the module metadata rather than the POM, so it gets the same GeckoLib check.
tasks.named('generateMetadataFileForMavenJavaPublication') {
	doLast {
		if (outputs.files.singleFile.text.contains('geckolib')) {
			throw new GradleException('GeckoLib leaked into the publication module metadata')
		}
	}
}

// check generates both publication files, so ./gradlew build refuses a GeckoLib leak before any release does.
tasks.named('check') {
	dependsOn 'generatePomFileForMavenJavaPublication', 'generateMetadataFileForMavenJavaPublication'
}
